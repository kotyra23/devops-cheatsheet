
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cheatsheet_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/cheatsheet.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - cheatsheet_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: cheatsheet_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cheatsheet_net

  grafana:
    image: grafana/grafana:latest
    container_name: cheatsheet_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - cheatsheet_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cheatsheet_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - cheatsheet_net

volumes:
  sqlite_data:
  prometheus_data:
  grafana_data:

networks:
  cheatsheet_net:
    driver: bridge
